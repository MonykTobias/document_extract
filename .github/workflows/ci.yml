name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m compileall -q src
      - run: python tests/run_all.py
      - run: python -m pip install "mypy==1.18.2"
      - run: python -m mypy src/document_extract/markdown src/document_extract/layout src/document_extract/config.py src/document_extract/runtime.py src/document_extract/models.py
