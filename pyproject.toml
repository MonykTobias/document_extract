[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docling-rag"
version = "0.1.0"
description = "Page-oriented Docling and multimodal RAG extraction pipeline"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
docling-rag = "docling_rag.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docling_rag = ["resources/config/*.yaml", "resources/prompts/*.md"]

